name: INVENTORY-SAAS CI

on:
  push:
    branches:
      - main

    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  APP_NAME: inventory-saas

jobs:

  # ==========================================
  # JOB 1 - CI
  # ==========================================

  ci:
    name: CI - Tests and Compilation
    runs-on: ubuntu-latest

    # PostgreSQL for testing
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_test
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Configuration for CI
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventory_test
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: test_password

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5.1.0

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Give Maven wrapper permission
        run: chmod +x mvnw

      - name: Run tests and package application
        run: ./mvnw -B clean verify

      - name: Prepare JAR and checksum
        shell: bash
        run: |
          set -euo pipefail

          JARS=(target/*.jar)

          # Exclude Spring Boot original JARs
          VALID_JARS=()

          for JAR in "${JARS[@]}"; do
            if [[ -f "$JAR" && "$JAR" != *.jar.original ]]; then
              VALID_JARS+=("$JAR")
            fi
          done

          if [[ ${#VALID_JARS[@]} -ne 1 ]]; then
            echo "Expected exactly one executable JAR."
            printf '%s\n' "${VALID_JARS[@]}"
            exit 1
          fi

          cp "${VALID_JARS[0]}" inventory-saas.jar

          sha256sum inventory-saas.jar > SHA256SUMS

          echo "Generated files:"
          ls -lh inventory-saas.jar SHA256SUMS

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: inventory-saas-${{ github.sha }}
          path: |
            inventory-saas.jar
            SHA256SUMS
          retention-days: 7

  # ==========================================
  # JOB 2 - GITHUB RELEASE
  # ==========================================

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: ci

    # Only publish when a version tag is pushed
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: ${GITHUB_REF_NAME}"
            echo "Expected format: v1.0.0"
            exit 1
          fi

      - name: Download JAR artifact
        uses: actions/download-artifact@v4.2.1
        with:
          name: inventory-saas-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Inventory SaaS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/inventory-saas.jar
            release-assets/SHA256SUMS