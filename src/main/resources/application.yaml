# Server Configuration
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: inventory-saas
  # Spring Configuration
  config:
    import:
      - optional:file:.env.docker[.properties]
      - optional:file:.env.spring[.properties]

  # Spring Profiles
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory-saas_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1200000

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
            scripts:
              action: create
              create-target: ./generated/schema.sql
            create-source: metadata
    show-sql: true
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: true
    locations:
      - classpath:/db/migration/common
    baseline-on-migrate: true
    validate-on-migrate: true
    schemas: public
    table: flyway_schema_history

# Springdoc Configuration
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    enabled: true
    operations-sorter: true
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:certs/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:certs/public_key.pem}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:86400000}