global:
  scrape_interval: 15s

scrape_configs:
  - job_name: inventory-saas
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8008']
        labels:
          application: inventory-saas

  - job_name: observability-my
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8009']
        labels:
          application: observability-my